<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mes jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen arcade console — tabs on top, game stage fills the rest, tray docked under the board */
:root{
  --bg:#141c3a; --panel:#0e1530; --cell:#1b2550; --line:#2c3a72;
  --ink:#eef2ff; --muted:#8e9bcc; --gold:#ffc54d; --tab:#232f5e;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;padding-inline:12px;padding-block:8px;display:flex;flex-direction:column;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);padding:4px;border-radius:14px}
.tab{font:600 1rem var(--display);color:var(--muted);background:transparent;border:0;border-radius:10px;padding:7px 0;cursor:pointer;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--tab);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;gap:10px;flex:none}
.stat{display:flex;flex-direction:column;line-height:1.05}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500}
.val{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.best .val{font-size:1.05rem;color:var(--gold)}
.btn{margin-left:auto;font:600 .85rem var(--display);color:var(--ink);background:var(--tab);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}

.ico{font-size:1.15rem;line-height:1;padding:7px 10px;min-width:40px}
.ico+.ico{margin-left:0}
.sel{margin-left:auto;font:600 .85rem var(--display);color:var(--gold);background:var(--tab);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer}
.sel:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.sel+.ico{margin-left:0}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
canvas{display:block;touch-action:none}
#bub-cv,#blk-cv,#cdy-cv{border-radius:12px}
.hud .stat{min-width:0}
.hud .ico{flex:none}
.hud .sel{min-width:0;flex:0 1 auto;max-width:9.5rem}
#cdy-v1{font-size:1.05rem;white-space:nowrap}
.gi{width:1.25em;height:1.25em;vertical-align:-.28em;margin-right:.15em}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.25em;vertical-align:.05em}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,32,.72);border-radius:12px}
.over .card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 26px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
.over h2{margin:0;font-size:1.5rem;font-weight:700}
.over p{margin:0;color:var(--muted)}
.over .big{font-size:2.2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.over .btn{margin:6px 0 0;background:var(--gold);color:#1a1300;border:0;padding:10px 20px;font-size:1rem}
.stars{font-size:2rem;letter-spacing:.15em;color:var(--gold)}
.stars .off{color:var(--line)}
.over .btn.alt{background:var(--tab);color:var(--ink);border:1px solid var(--line)}
.tray{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);grid-template-rows:108px;gap:8px;height:108px;flex:none;overflow:hidden}
.slot{width:100%;height:108px;min-width:0;cursor:grab}
.nextbox{position:relative;height:108px;min-width:0;overflow:hidden;border:1px dashed var(--line);border-radius:12px;text-align:center;padding-top:6px}
.nextbox canvas{position:absolute;left:4px;right:4px;top:24px;bottom:4px;width:calc(100% - 8px);height:calc(100% - 28px)}
.stage canvas,.tray{transition:opacity .35s,visibility .35s}
body.cele .stage canvas,body.cele .tray,body.cele .over{opacity:0;visibility:hidden}
.ask{position:fixed;z-index:40;border-radius:0}
#fxcv{position:fixed;left:0;top:0;pointer-events:none;z-index:50}
#sol-stage{place-items:start center}
.finish{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);margin:0;background:var(--gold);color:#1a1300;border:0;padding:10px 20px;font-size:1rem;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.btn:disabled{opacity:.4;cursor:default}
.tab{font-size:.95rem}
.home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.htitle{margin:2px 0 0;font-size:1.7rem;font-weight:700;letter-spacing:.01em}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,var(--tab),var(--panel));color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ticon{width:72px;height:72px}
.tname{font-size:1.1rem;font-weight:600}
.tsub{font-size:.74rem;color:var(--gold);text-align:center;min-height:1.1em}
#sol-draw{flex:none}
.hud{gap:7px}
.hud .stat .lbl{white-space:nowrap;font-size:.6rem;letter-spacing:.05em}
.hud .stat{flex:none}
.hud .sel{padding:7px 4px;font-size:.82rem}
.hud .homeb{margin-left:0;flex:none;display:grid;place-items:center;padding:7px 9px;min-width:36px}
.hud .ico{min-width:36px;padding:7px 8px}
.pad{flex:none;display:flex;flex-direction:column;gap:6px}
.padnums{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.pn{font:inherit;color:var(--ink);background:var(--tab);border:1px solid var(--line);border-radius:10px;padding:6px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1;cursor:pointer}
.pn b{font-size:1.35rem;font-weight:700}.pn small{font-size:.6rem;color:var(--muted);min-height:.7rem}
.pn.note b{color:#a9b4e0;font-weight:500}
.pn:disabled{opacity:.25}
.padtools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pt{font:600 .85rem var(--display);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 0;cursor:pointer}
.pt.on,.flagb.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.pt:disabled{opacity:.35}
#g-cdy{position:relative}
.goals{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
.gchip{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 6px 3px 3px;flex:none}
.gchip img{width:24px;height:24px}.gchip b{font-size:.95rem;font-variant-numeric:tabular-nums}
.gchip.ok{border-color:#4fd67a}.gchip.ok b{color:#4fd67a}
.gice{display:inline-block;width:20px;height:20px;margin:2px;border-radius:4px;background:linear-gradient(135deg,#dff4ff,#7fc4ef);border:2px solid #fff}
.gcherry{font-size:1.15rem;line-height:1;padding:0 2px}
.sbar{position:relative;flex:none;height:18px;border-radius:9px;background:var(--panel);border:1px solid var(--line);overflow:visible}
.sfill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#ff7ad9,#ffc54d);transition:width .3s}
.smark{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;color:#5b6699;font-size:1rem;text-shadow:0 1px 2px #000}
.smark.on{color:#ffe14d}
.slbl{position:absolute;inset:0;display:flex;align-items:center;padding-left:10px;font-size:.7rem;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.boost{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bst{position:relative;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.bst span{font-size:1.15rem;line-height:1.1;font-weight:700}.bst small{font-size:.6rem;color:var(--muted);white-space:nowrap}
.bst i{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1a1300;font:700 .7rem/18px var(--display);font-style:normal;text-align:center}
.bst.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.bst:disabled{opacity:.35}
.map{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.maphead{display:flex;align-items:center;gap:10px}
.mtitle{font-size:1.2rem;font-weight:700;flex:1}
.mstars{font-weight:700;color:var(--gold);font-size:1.1rem}
.mboost{font-size:.85rem;color:var(--muted);text-align:center}
.mapscroll{flex:1;min-height:0;overflow-y:auto;border-radius:16px;background:var(--panel);overscroll-behavior:contain}
.mapin{position:relative;overflow:hidden}
.wband{position:absolute;left:0;right:0;background:linear-gradient(180deg,color-mix(in srgb,var(--wc) 22%,transparent),color-mix(in srgb,var(--wc) 8%,transparent))}
.wtitle{position:absolute;left:50%;transform:translate(-50%,-50%);background:var(--wc);color:#fff;font-weight:700;font-size:.9rem;padding:6px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35);text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.wtitle small{display:block;font-size:.7rem;font-weight:600;opacity:.95}
.mpath{position:absolute;left:0;top:0;pointer-events:none}
.mpath polyline{fill:none;stroke:rgba(255,255,255,.28);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round}
.node{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--wc) 60%,#fff),var(--wc));color:#fff;font:700 1.05rem var(--display);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.45);cursor:pointer;padding:0;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.node.hard{border-color:#ff5a5a;box-shadow:0 0 0 3px rgba(255,90,90,.35),0 4px 10px rgba(0,0,0,.45)}
.node.lock{background:#3a4268;opacity:.7;cursor:default}
.node.cur{animation:pulse 1.1s ease-in-out infinite;border-color:var(--gold)}
.node .st{position:absolute;top:100%;margin-top:1px;font-size:.72rem;color:#ffe14d;white-space:nowrap;letter-spacing:-.05em}
.node .st em{font-style:normal;color:rgba(255,255,255,.3)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@media (prefers-reduced-motion:reduce){.node.cur{animation:none}}
.drag{position:fixed;left:0;top:0;pointer-events:none;z-index:10}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}
</style>
</head>
<body>


<div class="app">
  <section id="home" class="home">
    <h1 class="htitle">Mes jeux</h1>
    <div class="tiles">
      <button class="tile" data-g="bub"><canvas class="ticon" data-i="bub"></canvas><span class="tname">Bulles</span><span class="tsub" id="sub-bub"></span></button>
      <button class="tile" data-g="blk"><canvas class="ticon" data-i="blk"></canvas><span class="tname">Blocs</span><span class="tsub" id="sub-blk"></span></button>
      <button class="tile" data-g="cdy"><canvas class="ticon" data-i="cdy"></canvas><span class="tname">Gemmes</span><span class="tsub" id="sub-cdy"></span></button>
      <button class="tile" data-g="sol"><canvas class="ticon" data-i="sol"></canvas><span class="tname">Solitaire</span><span class="tsub" id="sub-sol"></span></button>
      <button class="tile" data-g="sdk"><canvas class="ticon" data-i="sdk"></canvas><span class="tname">Sudoku</span><span class="tsub" id="sub-sdk"></span></button>
      <button class="tile" data-g="mns"><canvas class="ticon" data-i="mns"></canvas><span class="tname">Démineur</span><span class="tsub" id="sub-mns"></span></button>
    </div>
  </section>

  <section id="g-bub" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="stat"><span class="lbl">Score</span><span id="bub-score" class="val">0</span></div>
      <div class="stat best"><span class="lbl">Record</span><span id="bub-best" class="val">0</span></div>
      <select id="bub-lvl" class="sel" aria-label="Niveau">
        <option value="0">Facile</option><option value="1">Moyen</option>
        <option value="2">Difficile</option><option value="3">Expert</option>
      </select>
      <button id="bub-new" class="btn ico" aria-label="Nouvelle partie" title="Nouvelle partie">↻</button>
      <button id="bub-snd" class="btn ico snd" aria-label="Son">🔊</button>
    </div>
    <div class="stage" id="bub-stage">
      <canvas id="bub-cv"></canvas>
      <div class="over" id="bub-over" hidden><div class="card">
        <h2>Les bulles ont gagné</h2><p>Score</p><div class="big" id="bub-final">0</div>
        <button class="btn" id="bub-again">Rejouer</button></div></div>
    </div>
  </section>

  <section id="g-blk" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="stat"><span class="lbl" id="blk-l1">Score</span><span id="blk-v1" class="val">0</span></div>
      <div class="stat best"><span class="lbl" id="blk-l2">Record</span><span id="blk-v2" class="val">0</span></div>
      <select id="blk-sel" class="sel" aria-label="Mode de jeu"></select>
      <button id="blk-new" class="btn ico" aria-label="Recommencer" title="Recommencer">↻</button>
    </div>
    <div class="stage" id="blk-stage">
      <canvas id="blk-cv"></canvas>
      <div class="over" id="blk-over" hidden><div class="card">
        <h2 id="blk-ot">Plus de place</h2><p id="blk-os">Score</p><div class="big" id="blk-final">0</div>
        <div class="stars" id="blk-stars" hidden></div>
        <button class="btn" id="blk-nextlvl" hidden>Niveau suivant</button>
        <button class="btn alt" id="blk-again">Rejouer</button></div></div>
    </div>
    <div class="tray">
      <canvas class="slot" data-i="0"></canvas>
      <canvas class="slot" data-i="1"></canvas>
      <canvas class="slot" data-i="2"></canvas>
      <div class="nextbox"><span class="lbl">Suivante</span><canvas id="blk-next"></canvas></div>
    </div>
  </section>

  <section id="g-cdy" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="goals" id="cdy-goals"></div>
      <div class="stat best"><span class="lbl">Coups</span><span id="cdy-v2" class="val">0</span></div>
      <button id="cdy-mapb" class="btn ico" aria-label="Carte des niveaux" title="Carte">🗺</button>
      <button id="cdy-new" class="btn ico" aria-label="Recommencer le niveau" title="Recommencer">↻</button>
    </div>
    <div class="sbar"><div class="sfill" id="cdy-sfill"></div><i class="smark" id="cdy-m2">★</i><i class="smark" id="cdy-m3">★</i><span class="slbl" id="cdy-slbl"></span></div>
    <div class="stage" id="cdy-stage">
      <canvas id="cdy-cv"></canvas>
      <div class="over" id="cdy-over" hidden><div class="card">
        <h2 id="cdy-ot">Raté !</h2><p id="cdy-os"></p>
        <div class="stars" id="cdy-stars" hidden></div>
        <button class="btn" id="cdy-nextlvl" hidden>Niveau suivant</button>
        <button class="btn alt" id="cdy-again">Réessayer</button>
        <button class="btn alt" id="cdy-tomap">Carte</button></div></div>
    </div>
    <div class="boost" id="cdy-boost"></div>
    <div class="map" id="cdy-map" hidden>
      <div class="maphead"><button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button><div class="mtitle">Carte des mondes</div><div class="mstars" id="cdy-tstars">★ 0</div></div>
      <div class="mboost" id="cdy-mboost"></div>
      <div class="mapscroll" id="cdy-mapsc"><div class="mapin" id="cdy-mapin"></div></div>
    </div>
  </section>

  <section id="g-sol" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="stat"><span class="lbl">Temps</span><span id="sol-time" class="val">0:00</span></div>
      <div class="stat best"><span class="lbl">Record</span><span id="sol-best" class="val">–</span></div>
      <select id="sol-draw" class="sel" aria-label="Pioche"><option value="1">Pioche 1</option><option value="3">Pioche 3</option></select>
      <button id="sol-undo" class="btn ico" aria-label="Annuler le dernier coup" title="Annuler (3 par donne)">↶3</button>
      <button id="sol-new" class="btn ico" aria-label="Nouvelle donne" title="Nouvelle donne">↻</button>
    </div>
    <div class="stage" id="sol-stage">
      <canvas id="sol-cv"></canvas>
      <button id="sol-fin" class="btn finish" hidden>Terminer ✨</button>
    </div>
  </section>

  <section id="g-sdk" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="stat"><span class="lbl">Temps</span><span id="sdk-time" class="val">0:00</span></div>
      <div class="stat best"><span class="lbl">Erreurs</span><span id="sdk-err" class="val">0</span></div>
      <select id="sdk-lvl" class="sel" aria-label="Niveau"><option value="0">Facile</option><option value="1">Moyen</option><option value="2">Difficile</option><option value="3">Expert</option></select>
      <button id="sdk-new" class="btn ico" aria-label="Nouvelle grille" title="Nouvelle grille">↻</button>
    </div>
    <div class="stage" id="sdk-stage"><canvas id="sdk-cv"></canvas></div>
    <div class="pad" id="sdk-pad"></div>
  </section>

  <section id="g-mns" class="game" hidden>
    <div class="hud">
      <button class="btn ico homeb" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></button>
      <div class="stat"><span class="lbl">Mines</span><span id="mns-left" class="val">0</span></div>
      <div class="stat best"><span class="lbl">Temps</span><span id="mns-time" class="val">0:00</span></div>
      <select id="mns-lvl" class="sel" aria-label="Niveau"><option value="0">Facile</option><option value="1">Moyen</option><option value="2">Difficile</option></select>
      <button id="mns-mode" class="btn ico flagb" aria-pressed="false" aria-label="Mode drapeau" title="Mode drapeau">🚩</button>
      <button id="mns-new" class="btn ico" aria-label="Nouvelle grille" title="Nouvelle grille">↻</button>
    </div>
    <div class="stage" id="mns-stage"><canvas id="mns-cv"></canvas></div>
    <p class="hint">Touche pour creuser · appui long (ou mode 🚩) pour poser un drapeau</p>
  </section>
</div>
<canvas id="drag" class="drag" hidden></canvas>
<div class="over ask" id="ask" hidden><div class="card">
  <h2 id="ask-t"></h2><p id="ask-s"></p>
  <button class="btn" id="ask-yes">Continuer</button>
  <button class="btn alt" id="ask-no">Nouvelle partie</button></div></div>
<canvas id="fxcv" hidden></canvas>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const DPR=()=>Math.min(window.devicePixelRatio||1,3);
const PAL={
  red:['#e84545','#ff9d92','#9c1d1d'], orange:['#f0892a','#ffc27a','#a9560b'],
  yellow:['#f5c518','#ffe880','#b08600'], green:['#36c060','#8cf0a8','#1b7f39'],
  cyan:['#35b9f2','#a8e7ff','#0a76a8'], blue:['#4a68f2','#a2b4ff','#2537a8'],
  purple:['#a259e6','#d6aaff','#64249f']
};

/* ================= CÉLÉBRATIONS ================= */
const Celebrate=(()=>{
  const cv=$('#fxcv'),ctx=cv.getContext('2d');
  const COLS=['#ff5a5a','#ffb03a','#ffe14d','#4fd67a','#35b9f2','#4a68f2','#a873ff','#ff7ad9'];
  let parts=[],kind='',text='',t=0,running=false,W=0,H=0,last=0,acc=0,AC=null;
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
  const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  function size(){const k=DPR();W=innerWidth;H=innerHeight;cv.width=Math.round(W*k);cv.height=Math.round(H*k);
    cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(k,0,0,k,0,0)}
  function tune(){if(store.get('bb.mute',false))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;[523,659,784,1047,1319,1568].forEach((f,i)=>{const o=AC.createOscillator(),v=AC.createGain(),s=t0+i*.085;
      o.type=i%2?'sine':'triangle';o.frequency.value=f;v.gain.setValueAtTime(.0001,s);v.gain.exponentialRampToValueAtTime(.16,s+.01);
      v.gain.exponentialRampToValueAtTime(.0001,s+(i===5?.6:.22));o.connect(v).connect(AC.destination);o.start(s);o.stop(s+.65)})}catch(e){}}
  function boomSnd(){if(store.get('bb.mute',false)||!AC)return;try{const t0=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(R()*2-1)*Math.pow(1-i/d.length,3);const s=AC.createBufferSource(),v=AC.createGain(),f=AC.createBiquadFilter();
    f.type='lowpass';f.frequency.value=900;s.buffer=b;v.gain.value=.25;s.connect(f).connect(v).connect(AC.destination);s.start(t0)}catch(e){}}
  // ---- fabriques
  const confetti=init=>({k:'conf',x:R()*W,y:init?-R()*H*.7:-20,vx:(R()-.5)*70,vy:90+R()*130,s:7+R()*8,rot:R()*6,vr:(R()-.5)*9,c:pick(COLS),w:R()*6});
  const bubble=()=>({k:'bub',x:R()*W,y:H+30,vy:-(140+R()*180),r:9+R()*18,ph:R()*6,c:pick(COLS),popY:H*(.08+R()*.6)});
  const rocket=()=>({k:'rock',x:W*(.12+R()*.76),y:H+10,vy:-(H*.95+R()*H*.35),ty:H*(.12+R()*.33),c:pick(COLS),c2:pick(COLS)});
  function burst(x,y,c,c2){const n=reduce()?20:64;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+R()*.1,sp=90+R()*170;
      parts.push({k:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:i%3?c:c2,life:1+R()*.7,age:0})}
    parts.push({k:'flash',x,y,c,age:0});boomSnd()}
  function pop(p){parts.push({k:'ring',x:p.x,y:p.y,r:p.r,c:p.c,age:0});
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2,sp=60+R()*80;parts.push({k:'spark',x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:p.c,life:.5+R()*.3,age:0})}}
  let onEnd=null,cardSrc=null;
  function start(k,txt,cb){kind=k;text=txt;t=0;acc=0;parts=[];onEnd=cb||null;size();cv.hidden=false;document.body.classList.add('cele');tune();
    if(k==='confetti')for(let i=0;i<(reduce()?40:150);i++)parts.push(confetti(true));
    if(k==='fireworks'){parts.push(rocket(),rocket())}
    if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}}
  // ---- dessin
  function drawBubble(p){const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,p.r*.1,p.x,p.y,p.r);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,p.c);g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.stroke()}
  function banner(){if(t>2.6)return;const fs=Math.min(W*.15,78);
    const sc=t<.45?(()=>{const x=t/.45,c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)})():1+Math.sin(t*5)*.025;
    const a=t>2.1?Math.max(0,1-(t-2.1)/.5):Math.min(1,t*6);
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.36);ctx.scale(sc,sc);ctx.rotate(Math.sin(t*3)*.03);
    ctx.font='700 '+fs+'px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(text).width,fit=Math.min(1,W*.88/w);ctx.scale(fit,fit);const g=ctx.createLinearGradient(-w/2,0,w/2,0);
    const sh=(t*120)%360;['#ffe14d','#ff7ad9','#35b9f2','#4fd67a','#ffb03a'].forEach((c,i,arr)=>g.addColorStop(i/(arr.length-1),c));
    ctx.shadowColor='rgba(255,200,80,.9)';ctx.shadowBlur=24;ctx.lineJoin='round';ctx.lineWidth=fs*.14;ctx.strokeStyle='#1a1240';ctx.strokeText(text,0,0);
    ctx.shadowBlur=0;ctx.fillStyle=g;ctx.fillText(text,0,0);
    ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<5;i++){const an=t*2+i*1.26+sh*0,rx=w*.6,ry=fs*.75;
      const x=Math.cos(an)*rx,y=Math.sin(an)*ry,s=3+Math.sin(t*8+i)*2;ctx.beginPath();ctx.moveTo(x,y-s*2);ctx.lineTo(x+s*.6,y);ctx.lineTo(x,y+s*2);ctx.lineTo(x-s*.6,y);ctx.closePath();ctx.fill()}
    ctx.restore()}
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;acc+=dt;
    const spawn=t<2.4&&!reduce();
    if(spawn&&kind==='bubbles')while(acc>.035){acc-=.035;parts.push(bubble())}
    if(spawn&&kind==='confetti')while(acc>.03){acc-=.03;parts.push(confetti(false))}
    if(spawn&&kind==='cards'&&cardSrc)while(acc>.14){acc-=.14;const o=cardSrc();parts.push({k:'card',img:o.img,w:o.w,h:o.h,x:W*(.2+R()*.6),y:H*(.08+R()*.1),vx:(R()<.5?-1:1)*(120+R()*170),vy:-R()*150,c:pick(COLS),tr:[]})}
    if(spawn&&kind==='digits')while(acc>.045){acc-=.045;const a=-Math.PI/2+(R()-.5)*2.4,sp=260+R()*320;
      parts.push({k:'dig',x:W/2,y:H*.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ch:String(1+Math.floor(R()*9)),c:pick(COLS),rot:(R()-.5),vr:(R()-.5)*6,s:20+R()*26})}
    if(spawn&&kind==='stars')while(acc>.03){acc-=.03;const a=R()*Math.PI*2,sp=120+R()*260;
      parts.push({k:'star',x:W/2,y:H*.36,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:pick(COLS),rot:R()*6,vr:(R()-.5)*8,s:6+R()*9,life:1.2+R()*.8,age:0})}
    if(spawn&&kind==='fireworks')while(acc>.32){acc-=.32;parts.push(rocket())}
    ctx.clearRect(0,0,W,H);
    if(kind==='stars'&&t<3){const a=Math.min(1,t*3)*(t>2.4?Math.max(0,(3-t)/.6):1);ctx.save();ctx.translate(W/2,H*.36);ctx.rotate(t*.6);
      for(let j=0;j<18;j++){ctx.globalAlpha=.18*a;ctx.fillStyle=COLS[j%COLS.length];ctx.beginPath();ctx.moveTo(0,0);const a1=j*Math.PI/9,a2=a1+Math.PI/18,L=Math.max(W,H);
        ctx.lineTo(Math.cos(a1)*L,Math.sin(a1)*L);ctx.lineTo(Math.cos(a2)*L,Math.sin(a2)*L);ctx.closePath();ctx.fill()}ctx.restore();ctx.globalAlpha=1}
    const keep=[];
    for(const p of parts){
      if(p.k==='conf'){p.x+=(p.vx+Math.sin(t*3+p.w)*40)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        if(p.y>H+20)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(t*6+p.w));
        ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.3);ctx.restore()}
      else if(p.k==='card'){p.vy+=1150*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>H-p.h){p.y=H-p.h;p.vy*=-.78}
        p.tr.push([p.x,p.y]);if(p.tr.length>22)p.tr.shift();if(p.x<-p.w-40||p.x>W+40)continue;
        p.tr.forEach(([tx,ty],j)=>{if(j%3)return;ctx.globalAlpha=.08+.5*j/p.tr.length;ctx.drawImage(p.img,tx,ty,p.w,p.h)});
        ctx.globalAlpha=1;ctx.save();ctx.shadowColor=p.c;ctx.shadowBlur=14;ctx.drawImage(p.img,p.x,p.y,p.w,p.h);ctx.restore()}
      else if(p.k==='dig'){p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.y>H+40)continue;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.font='700 '+Math.round(p.s)+'px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineWidth=4;ctx.strokeStyle='#1a1240';ctx.strokeText(p.ch,0,0);ctx.fillStyle=p.c;ctx.fillText(p.ch,0,0);ctx.restore()}
      else if(p.k==='star'){p.age+=dt;if(p.age>p.life)continue;p.vx*=.985;p.vy=p.vy*.985+60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        const q=1-p.age/p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=q;ctx.fillStyle=p.c;ctx.beginPath();
        for(let j=0;j<10;j++){const an=-Math.PI/2+j*Math.PI/5,d=j%2?p.s*.45:p.s;ctx[j?'lineTo':'moveTo'](Math.cos(an)*d,Math.sin(an)*d)}ctx.closePath();ctx.fill();ctx.restore();ctx.globalAlpha=1}
      else if(p.k==='bub'){p.y+=p.vy*dt;p.x+=Math.sin(t*3+p.ph)*30*dt;if(p.y<p.popY){pop(p);continue}drawBubble(p)}
      else if(p.k==='rock'){p.y+=p.vy*dt;p.vy*=.985;
        ctx.fillStyle=p.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
        ctx.globalAlpha=.35;ctx.fillRect(p.x-1,p.y,2,26);ctx.globalAlpha=1;
        if(p.y<=p.ty){burst(p.x,p.y,p.c,p.c2);continue}}
      else if(p.k==='spark'){p.age+=dt;if(p.age>p.life)continue;p.vy+=160*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;
        const a=1-p.age/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2+a*1.6,0,7);ctx.fill();
        ctx.globalAlpha=a*.4;ctx.beginPath();ctx.arc(p.x-p.vx*.03,p.y-p.vy*.03,1.6,0,7);ctx.fill();ctx.globalAlpha=1}
      else if(p.k==='ring'){p.age+=dt;if(p.age>.35)continue;const q=p.age/.35;ctx.globalAlpha=1-q;ctx.strokeStyle=p.c;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+q*1.4),0,7);ctx.stroke();ctx.globalAlpha=1}
      else if(p.k==='flash'){p.age+=dt;if(p.age>.25)continue;const q=p.age/.25,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,90);
        g.addColorStop(0,'rgba(255,255,255,'+(.7*(1-q))+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(p.x-90,p.y-90,180,180)}
      keep.push(p)}
    parts=keep;banner();
    if((t>2.7&&!parts.length)||t>6){running=false;cv.hidden=true;ctx.clearRect(0,0,W,H);document.body.classList.remove('cele');const f=onEnd;onEnd=null;if(f)f();return}
    requestAnimationFrame(loop)}
  addEventListener('resize',()=>{if(running)size()});
  function ask(title,sub,yes,no,onYes,onNo){$('#ask-t').textContent=title;$('#ask-s').textContent=sub;
    $('#ask-yes').textContent=yes;$('#ask-no').textContent=no;const box=$('#ask');box.hidden=false;
    $('#ask-yes').onclick=()=>{box.hidden=true;if(onYes)onYes()};$('#ask-no').onclick=()=>{box.hidden=true;if(onNo)onNo()}}
  return{setCards:f=>{cardSrc=f},run:start,ask,active:()=>running||!$('#ask').hidden}
})();

/* ================= BULLES ================= */
const Bubbles=(()=>{
  const R=20,RH=R*Math.sqrt(3);
  const LEVELS=[{cols:10,rows:12,start:6},{cols:13,rows:17,start:9},{cols:15,rows:19,start:10},{cols:17,rows:22,start:11}];
  let lvl=store.get('bb.bubLvl',0),COLS,DR,START,W,H,SX,SY,NX,NY,LIMIT;
  if(!(lvl>=0&&lvl<4))lvl=0;
  let aspect=0;
  function dims(){const L=LEVELS[lvl];COLS=L.cols;START=L.start;W=(2*COLS+1)*R;
    H=aspect?Math.floor(W*aspect):Math.round(R+L.rows*RH+110);
    DR=Math.max(START+3,Math.floor((H-110-R)/RH));
    SX=W/2;SY=H-46;NX=W-R*2.2;NY=SY+8;LIMIT=R+(DR-1)*RH+R+4}
  dims();
  const COL=['red','yellow','green','cyan','blue','purple','orange'].map(k=>PAL[k]);
  const cv=$('#bub-cv'),ctx=cv.getContext('2d'),stage=$('#bub-stage');
  let grid,parity,cur,nxt,shot,aim=null,aiming=false,fx=[],score,over,slide=0,k=1;
  (()=>{const old=store.get('bb.bubBest',null);if(old!=null&&store.get('bb.bubBest.3',null)==null)store.set('bb.bubBest.3',old)})();
  let best=store.get('bb.bubBest.'+lvl,0);
  const STEP=.035;
  let AC=null,muted=store.get('bb.mute',false);
  function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
  function plop(n){if(muted||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=520+Math.min(n,20)*45;
    o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.07);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.09);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
  function thud(){if(muted||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(90,t+.18);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.22)}catch(e){}}
  const sndBtn=$('#bub-snd');const sndUI=()=>{sndBtn.textContent=muted?'🔇':'🔊'};sndUI();
  sndBtn.onclick=()=>{muted=!muted;store.set('bb.mute',muted);sndUI();audio()};

  const shifted=r=>((r+parity)&1)===1;
  const cx=(r,c)=>R+c*2*R+(shifted(r)?R:0);
  const cy=r=>R+r*RH;
  const at=(r,c)=>(grid[r]&&grid[r][c]!=null)?grid[r][c]:null;
  let shots=0;
  // Facile 4 couleurs, Moyen 5, Difficile 6, Expert 7
  const nCol=()=>4+lvl;
  // pool : couleurs autorisées. Les nouvelles rangées n'utilisent que les couleurs encore présentes.
  const newRow=(pool)=>{const p=pool&&pool.length?pool:[...Array(nCol()).keys()];return Array.from({length:COLS},()=>p[rnd(p.length)])};
  function present(){const s=new Set();for(const row of grid)for(const v of row)if(v!=null)s.add(v);return[...s]}
  function pick(){const p=present();return p.length?p[rnd(p.length)]:rnd(nCol())}
  function nbrs(r,c){const o=[[r,c-1],[r,c+1]];const a=shifted(r)?[c,c+1]:[c-1,c];
    for(const rr of[r-1,r+1])for(const cc of a)o.push([rr,cc]);
    return o.filter(([rr,cc])=>rr>=0&&cc>=0&&cc<COLS)}

  function reset(){shots=0;grid=[];parity=0;for(let i=0;i<START;i++)grid.push(newRow());
    score=0;over=false;shot=null;fx=[];slide=0;cur=pick();nxt=pick();aim=null;hud();$('#bub-over').hidden=true}
  function hud(){if(score>best){best=score;store.set('bb.bubBest.'+lvl,best)}
    $('#bub-score').textContent=score;$('#bub-best').textContent=best}

  function hits(x,y){if(y<=R)return true;
    if(y>cy(grid.length)+2*R)return false;
    const lim=(2*R*.88)**2;
    for(let r=0;r<grid.length;r++){const yy=cy(r);if(Math.abs(yy-y)>2*R)continue;
      for(let c=0;c<COLS;c++){if(grid[r][c]==null)continue;const dx=cx(r,c)-x,dy=yy-y;if(dx*dx+dy*dy<lim)return true}}
    return false}
  function snap(x,y){let b=null,bd=1e9;
    for(let r=0;r<=grid.length;r++)for(let c=0;c<COLS;c++){
      if(at(r,c)!=null)continue;
      if(r>0&&!nbrs(r,c).some(([a,q])=>at(a,q)!=null))continue;
      const d=(cx(r,c)-x)**2+(cy(r)-y)**2;if(d<bd){bd=d;b=[r,c]}}
    return b}
  function trace(a){let x=SX,y=SY,dx=Math.cos(a),dy=-Math.sin(a);const pts=[];
    for(let i=0;i<1600;i++){x+=dx*4;y+=dy*4;
      if(x<R){x=2*R-x;dx=-dx}if(x>W-R){x=2*(W-R)-x;dx=-dx}
      if(i%6===3)pts.push([x,y]);if(hits(x,y))break}
    return{pts,x,y}}
  function flood(r,c){const col=grid[r][c],seen=new Set([r+','+c]),q=[[r,c]],out=[];
    while(q.length){const[a,b]=q.pop();out.push([a,b]);
      for(const[x,y]of nbrs(a,b)){const key=x+','+y;if(!seen.has(key)&&at(x,y)===col){seen.add(key);q.push([x,y])}}}
    return out}
  function floating(){const seen=new Set(),q=[];
    if(grid[0])for(let c=0;c<COLS;c++)if(grid[0][c]!=null){seen.add('0,'+c);q.push([0,c])}
    while(q.length){const[a,b]=q.pop();for(const[x,y]of nbrs(a,b)){const key=x+','+y;if(!seen.has(key)&&at(x,y)!=null){seen.add(key);q.push([x,y])}}}
    const out=[];for(let r=0;r<grid.length;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!=null&&!seen.has(r+','+c))out.push([r,c]);
    return out}
  function addRow(){grid.unshift(newRow(present()));parity^=1;slide=RH}
  function trim(){while(grid.length&&grid[grid.length-1].every(v=>v==null))grid.pop()}

  function fire(){if(over||shot||aim==null)return;shots++;
    shot={x:SX,y:SY,dx:Math.cos(aim),dy:-Math.sin(aim),c:cur};cur=nxt;nxt=null}
  function land(){const cell=snap(shot.x,shot.y);const color=shot.c;shot=null;if(!cell)return;

  const ingOnBoard=()=>{let n=0;for(const row of g)for(const k of row)if(k&&k.ing)n++;return n};

  const chestsLeft=()=>{let n=0;for(const row of g)for(const k of row)if(k&&k.o==='chest')n++;return n};
  function shuffle(silent){if(++shuf>30){over=true;state='idle';showOver('Bloqué !','Plus aucun coup possible sur ce plateau.',0,false,'Réessayer');return}
    const fr=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=g[r][c];if(canSwap(k)&&!k.s&&!k.ing)fr.push(k)}

  /* ---------- Obstacles ---------- */
  function damage(i,hits){if(hits.has(i))return;const[r,c]=RC(i),k=g[r][c];if(!k)return;

    else fx.push({t:'hit',r,c,age:0})}
  function openChest(){const ch=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]&&g[r][c].o==='chest')ch.push([r,c]);if(!ch.length)return;
    const[r,c]=ch[rnd(ch.length)];fx.push({t:'opop',r,c,o:'chest',age:0},{t:'boom',r,c,age:0,R:1.2});score+=300;snd(5);
    g[r][c]=mk(rc(),Math.random()<.3?'b':Math.random()<.5?'w':(Math.random()<.5?'h':'v'),r);if(g[r][c].s==='b')g[r][c].c=-1}
  function pickTarget(excl){const tiers=[[],[],[],[]];
    for(let i=0;i<N*N;i++){if(excl.has(i))continue;const[r,c]=RC(i),k=g[r][c];if(!k||k.ing||(k.o&&(k.o==='hole'||k.o==='chest')))continue;
      if(ice[i]&&!k.o)tiers[0].push(i);else if(k.o||k.mm||k.lk)tiers[1].push(i);
      else if(lv.goals.colors&&lv.goals.colors[k.c]!=null&&(prog.colors[k.c]||0)<lv.goals.colors[k.c])tiers[2].push(i);else tiers[3].push(i)}

  /* ---------- Effacement, gravité, cascades ---------- */
  function present(){const s=new Set();for(const row of g)for(const k of row)if(free(k)&&k.c>=0)s.add(k.c);return[...s]}
  function lineCells(r,c,h){const out=[id(r,c)];for(const d of[-1,1]){let x=h?c+d:r+d;while(x>=0&&x<N){const i=h?id(r,x):id(x,c),k=h?g[r][x]:g[x][c];out.push(i);if(k&&k.o==='swirl')break;x+=d}}return out}
  function fishHit(fr,fc,t,pay,add){const[tr,tc]=RC(t);add.push(t);fx.push({t:'fish',fr,fc,tr,tc,c:g[fr][fc]&&g[fr][fc].c>=0?g[fr][fc].c:4,age:0});
    if(pay==='h'||pay==='v')lineCells(tr,tc,pay==='h').forEach(j=>add.push(j));
    if(pay==='w')for(let y=tr-1;y<=tr+1;y++)for(let x=tc-1;x<=tc+1;x++)if(y>=0&&x>=0&&y<N&&x<N)add.push(id(y,x))}
  function clear(set,creates){const all=new Set(set),q=[...set],trig=new Set();
    while(q.length){const i=q.pop();if(trig.has(i))continue;trig.add(i);const[r,c]=RC(i),k=g[r][c];if(!isGem(k)||!k.s||k.mm)continue;
      const add=[];
      if(k.s==='h'||k.s==='v'){lineCells(r,c,k.s==='h').forEach(j=>add.push(j));fx.push({t:'beam',r,c,h:k.s==='h',age:0})}
      else if(k.s==='w'||k.s==='w2'){for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&x>=0&&y<N&&x<N)add.push(id(y,x));fx.push({t:'boom',r,c,age:0,R:1.6})}
      else if(k.s==='f'){const t=pickTarget(all);if(t>=0)fishHit(r,c,t,k.fp,add)}
      else if(k.s==='b'){const p=present();const col=k.target!=null?k.target:p[rnd(p.length)];
        if(k.target===-2){for(let j=0;j<N*N;j++)add.push(j)}else for(let y=0;y<N;y++)for(let x=0;x<N;x++){const o=g[y][x];if(isGem(o)&&o.c===col)add.push(id(y,x))}}
      add.forEach(j=>{if(!all.has(j)){all.add(j);q.push(j)}})}
    let n=0;const hits=new Set(),gemCells=[];
    all.forEach(i=>{const[r,c]=RC(i),k=g[r][c];if(!k||k.ing)return;
      if(k.o||k.mm){damage(i,hits);return}
      n++;gemCells.push(i);
      if(ice[i]){ice[i]--;if(lv.goals.ice)prog.ice++;fx.push({t:'ice',r,c,age:0})}
      if(k.lk){k.lk=false;fx.push({t:'unlock',r,c,age:0});return}
      if(k.s==='w'&&trig.has(i)){k.s='w2';fx.push({t:'made',r,c,age:0});return}
      if(lv.goals.colors&&lv.goals.colors[k.c]!=null)prog.colors[k.c]=(prog.colors[k.c]||0)+1;
      if(k.key){fx.push({t:'keyfly',r,c,age:0});setTimeout(openChest,0)}
      fx.push({t:'pop',r,c,k,age:0});g[r][c]=null});
    gemCells.forEach(i=>{const[r,c]=RC(i);nb4(r,c).forEach(([a,b])=>{const o=g[a][b];if(o&&(o.o||o.mm))damage(id(a,b),hits)})});
    creates.forEach(x=>{const[r,c]=RC(x.i);if(!g[r][c]||isGem(g[r][c])){g[r][c]=mk(x.c,x.s,r);
      const kd=x.s==='b'?'bomb':x.s==='w'?'ring':x.s==='f'?'fish':'line';prog.specials[kd]=(prog.specials[kd]||0)+1;fx.push({t:'made',r,c,age:0})}});

    if(cascade>1&&phase!=='final')fx.push({t:'txt',s:cascade>=4?'Éblouissant !':cascade>=3?'Superbe !':'Bien !',age:0});
    snd(cascade);hud();state='pop';anim={t:0}}
  function gravity(){const need=lv.goals.drop?lv.goals.drop-prog.drop-ingOnBoard():0;const needKey=lv.keys&&chestsLeft()>keysOnBoard();let spawned=0,kspawn=false;

  function collectIng(){let n=0;for(let c=0;c<N;c++){const r=exitRow[c],k=g[r][c];if(k&&k.ing){g[r][c]=null;prog.drop++;n++;score+=500;fx.push({t:'ingot',r,c,it:k.it,age:0})}}

  function endMove(){

    if(!shadowHit){const sh=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]&&g[r][c].o==='shadow')sh.push([r,c]);

      for(const[r,c]of sh){const opts=nb4(r,c).filter(([a,b])=>{const k=g[a][b];return free(k)&&!k.lk&&!k.s&&!k.key&&!(lv.goals.drop&&a===exitRow[b])});
        if(opts.length){const[a,b]=opts[rnd(opts.length)];g[a][b]={o:'shadow',hp:1,y:a};fx.push({t:'spread',r:a,c:b,age:0});break}}}

  /* ---------- Échanges ---------- */
  const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
  function trySwap(a,b){if(state!=='idle'||over||phase)return;sel=null;hint=null;idle=0;
    if(!canSwap(g[a[0]][a[1]])||!canSwap(g[b[0]][b[1]])){fx.push({t:'no',r:a[0],c:a[1],age:0});return}

  function startMove(fr){if(fr){useBoost('swap');return}moves--;inMove=true;shadowHit=false;shuf=0}
  function afterSwap(a,b,fr){const A=g[a[0]][a[1]],B=g[b[0]][b[1]];cascade=1;const[br,bc]=b;
    const isSp=k=>isGem(k)&&k.s;

      if(A.s==='b'&&B.s==='b'){A.target=-2;fx.push({t:'boom',r:br,c:bc,age:0,R:6});clear(new Set([id(...a)]),[]);return}

      if(A.s==='f'||B.s==='f'){const other=A.s==='f'?B:A,pay=['h','v','w'].includes(other.s)?other.s:null,count=A.s==='f'&&B.s==='f'?3:1;

  /* ---------- Bonus ---------- */
  const BOOST={hammer:['🔨','Marteau'],swap:['⇄','Échange libre'],plus5:['+5','+5 coups'],mix:['🔀','Mélange']};

  function boostClick(k){if(over||phase||!(boost[k]>0))return;

  function hammerAt(r,c){if(state!=='idle')return;const k=g[r][c];if(!k||k.ing||(k.o&&(k.o==='hole'||k.o==='chest')))return;useBoost('hammer');cascade=1;fx.push({t:'boom',r,c,age:0,R:.8});

  function hud(){$('#cdy-goals').innerHTML=chips();$('#cdy-v2').textContent=moves;

  /* ---------- Carte du monde ---------- */
  function openMap(){mapEl.hidden=false;$('#cdy-over').hidden=true;requestAnimationFrame(buildMap)}
  function buildMap(){const W=mapSc.clientWidth||320,um=unlockedMax(),lastW=worldOf(Math.max(1,um)).w+1;
    const total=firstOf(lastW)+sizeOf(lastW)-1,STEP=78,HEAD=84,PAD=60;
    const pos=[];let y=PAD;
    for(let n=1;n<=total;n++){const{idx}=worldOf(n);if(idx===0)y+=HEAD;pos[n]=y;y+=STEP}
    const Ht=y+PAD;let h='',pts=[];
    for(let w=1;w<=lastW;w++){const wi=wInfo(w),f=firstOf(w),l=f+sizeOf(w)-1,y0=Ht-(pos[l]+STEP/2),y1=Ht-(pos[f]-HEAD);
      h+=`<div class="wband" style="top:${y0}px;height:${y1-y0}px;--wc:${wi.col}"></div>`;
      const ts=totalStars(),req=gateReq(w),locked=w>1&&ts<req;
      h+=`<div class="wtitle" style="top:${Ht-pos[f]+HEAD*.62}px;--wc:${wi.col}">Monde ${w} · ${wi.name}${locked?`<small>🔒 ${req} ★ requises · tu en as ${ts}</small>`:wi.feat&&w>1?`<small>Nouveau : ${FEATNAME[wi.feat]}</small>`:''}</div>`}

/* ================= SUDOKU ================= */
const Sudoku=(()=>{
  const cv=$('#sdk-cv'),ctx=cv.getContext('2d'),stage=$('#sdk-stage'),pad=$('#sdk-pad'),lvlSel=$('#sdk-lvl');
  const CLUES=[40,33,28,24];
  let lvl=store.get('bb.sdkLvl',0);if(!(lvl>=0&&lvl<4))lvl=0;
  let sol=[],puz=[],val=[],notes=[],sel=-1,noteMode=false,errors=0,hints=3,t0=0,elapsed=0,over=false,size=297,cell=33,glow=[];
  const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
  const R_=i=>Math.floor(i/9),C_=i=>i%9,B_=i=>Math.floor(R_(i)/3)*3+Math.floor(C_(i)/3);
  const peers=i=>{const o=[];for(let j=0;j<81;j++)if(j!==i&&(R_(j)===R_(i)||C_(j)===C_(i)||B_(j)===B_(i)))o.push(j);return o};
  const PEERS=[...Array(81).keys()].map(peers);
  const can=(g,i,n)=>PEERS[i].every(j=>g[j]!==n);
  function fill(g){const i=g.indexOf(0);if(i<0)return true;for(const n of shuffle([1,2,3,4,5,6,7,8,9]))if(can(g,i,n)){g[i]=n;if(fill(g))return true;g[i]=0}return false}

    for(let i=0;i<81;i++)if(!g[i]){const o=[];for(let n=1;n<=9;n++)if(can(g,i,n))o.push(n);if(!o.length)return 0;if(!opts||o.length<opts.length){best=i;opts=o;if(o.length===1)break}}
    if(best<0)return 1;let tot=0;for(const n of opts){g[best]=n;tot+=count(g,lim-tot);g[best]=0;if(tot>=lim)break}return tot}
  function generate(){const g=new Array(81).fill(0);fill(g);sol=g.slice();const p=g.slice();let clues=81;const t=performance.now();
    for(const i of shuffle([...Array(81).keys()])){if(clues<=CLUES[lvl]||performance.now()-t>1500)break;const b=p[i];p[i]=0;if(count(p,2)!==1)p[i]=b;else clues--}
    puz=p}
  function newGame(){generate();val=puz.slice();notes=new Array(81).fill(0);sel=-1;errors=0;hints=3;t0=0;elapsed=0;over=false;glow=[];ui()}

    else{notes[sel]=0;PEERS[sel].forEach(j=>notes[j]&=~(1<<n));tick(false);

  let AC=null;

    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(bad?.08:.12,t+.005);v.gain.exponentialRampToValueAtTime(.0001,t+(bad?.18:.08));o.connect(v).connect(AC.destination);o.start(t);o.stop(t+.2)}catch(e){}}

  /* ---------- Clavier ---------- */
  function buildPad(){let h='<div class="padnums">';for(let n=1;n<=9;n++)h+=`<button class="pn" data-n="${n}"><b>${n}</b><small></small></button>`;

    pad.innerHTML=h;pad.querySelectorAll('.pn').forEach(b=>b.onclick=()=>input(+b.dataset.n));
    $('#sdk-note').onclick=()=>{noteMode=!noteMode;ui()};$('#sdk-erase').onclick=erase;$('#sdk-hint').onclick=hint}

    $('#sdk-note').classList.toggle('on',noteMode);$('#sdk-hint').textContent='Indice '+hints;$('#sdk-hint').disabled=!hints||over}

  /* ---------- Dessin ---------- */
  function frame(dt){if(t0&&!over)elapsed=(performance.now()-t0)/1000;$('#sdk-time').textContent=fmt(elapsed);

    const k=DPR();ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,size,size);
    ctx.fillStyle='#16204a';ctx.fillRect(0,0,size,size);
    const sv=sel>=0?val[sel]:0;
    for(let i=0;i<81;i++){const x=C_(i)*cell,y=R_(i)*cell;let bg=(B_(i)%2)?'#1a2556':'#1e2a60';
      if(sel>=0&&(R_(i)===R_(sel)||C_(i)===C_(sel)||B_(i)===B_(sel)))bg='#273775';
      if(sv&&val[i]===sv)bg='#3a4a8f';
      if(i===sel)bg='#5a4a1a';

      const gl=glow.find(g=>g.i===i&&g.age>=0);if(gl){ctx.fillStyle='rgba(255,197,77,'+(.55*(1-gl.age/.6))+')';ctx.fillRect(x,y,cell,cell)}

      const v=val[i];ctx.textAlign='center';ctx.textBaseline='middle';
      if(v){ctx.font=(puz[i]?'700 ':'600 ')+Math.round(cell*.62)+'px Fredoka, sans-serif';
        ctx.fillStyle=puz[i]?'#eef2ff':v===sol[i]?'#7fd0ff':'#ff6b6b';ctx.fillText(v,x+cell/2,y+cell/2+1)}
      else if(notes[i]){ctx.font='500 '+Math.round(cell*.26)+'px Fredoka, sans-serif';ctx.fillStyle='#a9b4e0';
        for(let n=1;n<=9;n++)if(notes[i]&1<<n)ctx.fillText(n,x+cell*(.2+((n-1)%3)*.3),y+cell*(.2+Math.floor((n-1)/3)*.3)+1)}}
    ctx.strokeStyle='rgba(142,155,204,.35)';ctx.lineWidth=1;ctx.beginPath();
    for(let j=1;j<9;j++){if(j%3===0)continue;ctx.moveTo(j*cell+.5,0);ctx.lineTo(j*cell+.5,size);ctx.moveTo(0,j*cell+.5);ctx.lineTo(size,j*cell+.5)}ctx.stroke();
    ctx.strokeStyle='#8e9bcc';ctx.lineWidth=2.5;ctx.beginPath();
    for(let j=0;j<=9;j+=3){ctx.moveTo(j*cell,0);ctx.lineTo(j*cell,size);ctx.moveTo(0,j*cell);ctx.lineTo(size,j*cell)}ctx.stroke()}

  cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/cell),r=Math.floor((e.clientY-b.top)/cell);
    if(r>=0&&c>=0&&r<9&&c<9){sel=r*9+c}});
  addEventListener('keydown',e=>{if($('#g-sdk').hidden)return;if(/^[1-9]$/.test(e.key))input(+e.key);else if(e.key==='Backspace'||e.key==='Delete')erase()});
  function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
    size=Math.floor(Math.min(w,h)/9)*9;cell=size/9;cv.style.width=size+'px';cv.style.height=size+'px';cv.width=Math.round(size*DPR());cv.height=Math.round(size*DPR())}
  new ResizeObserver(resize).observe(stage);
  lvlSel.value=String(lvl);lvlSel.onchange=()=>{lvl=+lvlSel.value;store.set('bb.sdkLvl',lvl);lvlSel.blur();newGame()};
  $('#sdk-new').onclick=newGame;
  buildPad();newGame();
  return{frame,resize,sub:()=>{const b=store.get('bb.sdkBest'+lvl,0);return(['Facile','Moyen','Difficile','Expert'][lvl])+(b?' · record '+fmt(b):'')}}
})();

/* ================= DÉMINEUR ================= */
const Mines=(()=>{
  const cv=$('#mns-cv'),ctx=cv.getContext('2d'),stage=$('#mns-stage'),lvlSel=$('#mns-lvl'),modeBtn=$('#mns-mode');
  const LV=[{c:9,r:11,m:12},{c:10,r:14,m:24},{c:12,r:18,m:45}];
  const NUMC=['','#5aa8ff','#4fd67a','#ff6b6b','#c58bff','#ffb03a','#4fe0d8','#eef2ff','#9aa3c0'];
  let lvl=store.get('bb.mnsLvl',0);if(!(lvl>=0&&lvl<3))lvl=0;
  let C,R,M,mine,rev,flag,adj,first,over,won,t0,elapsed,flagMode=false,cell=30,ox=0,oy=0,W=300,H=400,boom=-1,press=null,fx=[];
  const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  const nb=i=>{const r=Math.floor(i/C),c=i%C,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<R&&cc<C)o.push(rr*C+cc)}return o};
  function newGame(){({c:C,r:R,m:M}=LV[lvl]);const n=C*R;mine=new Array(n).fill(false);rev=new Array(n).fill(false);flag=new Array(n).fill(false);adj=new Array(n).fill(0);
    first=true;over=false;won=false;t0=0;elapsed=0;boom=-1;press=null;fx=[];resize();ui()}
  function place(safe){const ban=new Set([safe,...nb(safe)]),cand=[];for(let i=0;i<C*R;i++)if(!ban.has(i))cand.push(i);
    for(let i=cand.length-1;i>0;i--){const j=rnd(i+1);[cand[i],cand[j]]=[cand[j],cand[i]]}
    cand.slice(0,M).forEach(i=>mine[i]=true);for(let i=0;i<C*R;i++)adj[i]=nb(i).filter(j=>mine[j]).length}
  function reveal(i){if(over||flag[i]||rev[i])return;
    if(first){place(i);first=false;t0=performance.now()}
    if(mine[i]){lose(i);return}
    const st=[i];let n=0;while(st.length){const j=st.pop();if(rev[j]||flag[j])continue;rev[j]=true;n++;fx.push({t:'open',i:j,age:-n*.008});
      if(!adj[j])nb(j).forEach(k=>{if(!rev[k]&&!mine[k])st.push(k)})}
    snd(n>3?2:1);ui();checkWin()}
  function chord(i){if(!rev[i]||!adj[i]||over)return;const ns=nb(i);if(ns.filter(j=>flag[j]).length!==adj[i])return;
    ns.forEach(j=>{if(!rev[j]&&!flag[j])reveal(j)})}
  function toggleFlag(i){if(over||rev[i])return;flag[i]=!flag[i];fx.push({t:'flag',i,age:0});snd(0);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}ui()}
  function lose(i){over=true;boom=i;elapsed=t0?(performance.now()-t0)/1000:0;snd(9);
    mine.forEach((m,j)=>{if(m&&j!==i)fx.push({t:'mine',i:j,age:-.15-Math.random()*.9})});
    setTimeout(()=>{if(over&&!won)Celebrate.ask('Boum !','Tu as touché une mine. On rejoue ?','Rejouer','Voir la grille',newGame,null)},1500)}
  function checkWin(){if(over)return;for(let i=0;i<C*R;i++)if(!mine[i]&&!rev[i])return;
    over=true;won=true;elapsed=(performance.now()-t0)/1000;mine.forEach((m,j)=>{if(m)flag[j]=true});ui();
    const k='bb.mnsBest'+lvl,b=store.get(k,0),rec=!b||elapsed<b;if(rec)store.set(k,elapsed);
    Celebrate.run('stars','Déminé !',()=>Celebrate.ask(rec?'Nouveau record !':'Grille déminée !','En '+fmt(elapsed)+'. Une nouvelle grille ?','Nouvelle grille','Revoir la grille',newGame,null))}
  let AC=null;
  function snd(k){if(store.get('bb.mute',false))return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
    if(k===9){const b=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
      const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();f.type='lowpass';f.frequency.value=600;v.gain.value=.6;s.buffer=b;s.connect(f).connect(v).connect(AC.destination);s.start(t);return}
    const o=AC.createOscillator(),v=AC.createGain();o.type=k===0?'triangle':'sine';o.frequency.value=k===0?520:k===2?700:900;
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.1,t+.005);v.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
  function ui(){$('#mns-left').textContent=M-flag.filter(Boolean).length;modeBtn.classList.toggle('on',flagMode);modeBtn.setAttribute('aria-pressed',flagMode)}

  /* ---------- Dessin ---------- */
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function drawMine(x,y,s,a=1){const cx=x+s/2,cy=y+s/2,r=s*.22;ctx.globalAlpha=a;ctx.strokeStyle='#0b0f22';ctx.lineWidth=s*.07;ctx.beginPath();
    for(let k=0;k<4;k++){const an=k*Math.PI/4;ctx.moveTo(cx-Math.cos(an)*r*1.6,cy-Math.sin(an)*r*1.6);ctx.lineTo(cx+Math.cos(an)*r*1.6,cy+Math.sin(an)*r*1.6)}ctx.stroke();
    const g=ctx.createRadialGradient(cx-r*.4,cy-r*.4,r*.1,cx,cy,r);g.addColorStop(0,'#7c84a3');g.addColorStop(1,'#0b0f22');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.globalAlpha=1}
  function drawFlag(x,y,s,sc=1){const cx=x+s/2,b=y+s*.8;ctx.save();ctx.translate(cx,b);ctx.scale(sc,sc);ctx.fillStyle='#d9dbe8';ctx.fillRect(-s*.03,-s*.6,s*.06,s*.6);
    ctx.fillStyle='#ff4d5e';ctx.beginPath();ctx.moveTo(s*.03,-s*.6);ctx.lineTo(s*.3,-s*.47);ctx.lineTo(s*.03,-s*.34);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d9dbe8';ctx.fillRect(-s*.15,-s*.04,s*.3,s*.06);ctx.restore()}
  function frame(dt){if(t0&&!over)elapsed=(performance.now()-t0)/1000;$('#mns-time').textContent=fmt(elapsed);
    fx=fx.filter(f=>(f.age+=dt)<(f.t==='mine'?1.2:.3));
    const k=DPR();ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
    const s=cell,pad=Math.max(1,s*.05);
    for(let i=0;i<C*R;i++){const x=ox+(i%C)*s,y=oy+Math.floor(i/C)*s;
      const op=fx.find(f=>f.t==='open'&&f.i===i);const opening=op&&op.age<.15;
      if(!rev[i]||opening&&op.age<0){const g=ctx.createLinearGradient(x,y,x+s,y+s);g.addColorStop(0,'#4a5fb0');g.addColorStop(1,'#26347a');
        rr(x+pad,y+pad,s-2*pad,s-2*pad,s*.16);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.stroke();
        const mf=fx.find(f=>f.t==='mine'&&f.i===i&&f.age>=0);
        if(flag[i]){const ff=fx.find(f=>f.t==='flag'&&f.i===i);drawFlag(x,y,s,ff?.6+ff.age/.3*.4:1);
          if(over&&!won&&!mine[i]){ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+s*.2,y+s*.2);ctx.lineTo(x+s*.8,y+s*.8);ctx.moveTo(x+s*.8,y+s*.2);ctx.lineTo(x+s*.2,y+s*.8);ctx.stroke()}}
        else if(mf){rr(x+pad,y+pad,s-2*pad,s-2*pad,s*.16);ctx.fillStyle='rgba(255,90,90,'+Math.max(0,.6-mf.age)+')';ctx.fill();drawMine(x,y,s,Math.min(1,mf.age*4))}
        else if(over&&!won&&mine[i]&&!fx.some(f=>f.t==='mine'&&f.i===i))drawMine(x,y,s);
        continue}
      rr(x+pad,y+pad,s-2*pad,s-2*pad,s*.12);ctx.fillStyle=i===boom?'#c8323c':'#121a3c';ctx.fill();
      if(op){ctx.fillStyle='rgba(255,255,255,'+(.25*(1-op.age/.3))+')';ctx.fill()}
      if(mine[i])drawMine(x,y,s);
      else if(adj[i]){ctx.fillStyle=NUMC[adj[i]];ctx.font='700 '+Math.round(s*.6)+'px Fredoka, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(adj[i],x+s/2,y+s/2+1)}}
  }

  /* ---------- Toucher ---------- */
  function cellAt(e){const b=cv.getBoundingClientRect(),c=Math.floor((e.clientX-b.left-ox)/cell),r=Math.floor((e.clientY-b.top-oy)/cell);return r>=0&&c>=0&&r<R&&c<C?r*C+c:-1}
  cv.addEventListener('pointerdown',e=>{if(over)return;const i=cellAt(e);if(i<0)return;
    press={i,x:e.clientX,y:e.clientY,done:false,tm:setTimeout(()=>{if(press&&!press.done){press.done=true;if(rev[press.i])chord(press.i);else toggleFlag(press.i)}},380)}});
  cv.addEventListener('pointermove',e=>{if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>12){clearTimeout(press.tm);press=null}});
  cv.addEventListener('pointerup',()=>{if(!press)return;clearTimeout(press.tm);const p=press;press=null;if(p.done)return;
    if(rev[p.i])chord(p.i);else if(flagMode)toggleFlag(p.i);else reveal(p.i)});
  cv.addEventListener('pointercancel',()=>{if(press)clearTimeout(press.tm);press=null});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h||!C)return;W=w;H=h;
    cell=Math.floor(Math.min(w/C,h/R));ox=Math.floor((w-cell*C)/2);oy=Math.floor((h-cell*R)/2);
    cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*DPR());cv.height=Math.round(H*DPR())}
  new ResizeObserver(resize).observe(stage);
  lvlSel.value=String(lvl);lvlSel.onchange=()=>{lvl=+lvlSel.value;store.set('bb.mnsLvl',lvl);lvlSel.blur();newGame()};
  modeBtn.onclick=()=>{flagMode=!flagMode;ui()};$('#mns-new').onclick=newGame;
  newGame();
  return{frame,resize,sub:()=>{const b=store.get('bb.mnsBest'+lvl,0);return(['Facile','Moyen','Difficile'][lvl])+(b?' · record '+fmt(b):'')}}
})();

/* ================= ACCUEIL ================= */
const Home=(()=>{
  const gemImgs=['g4','g0','g3'].map(n=>{const im=new Image();im.src='gems/'+n+'.png';im.onload=()=>draw();return im});
  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
  function ball(g,x,y,r,c){const[b,l,d]=PAL[c];const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,l);gr.addColorStop(.55,b);gr.addColorStop(1,d);
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(x-r*.33,y-r*.45,r*.27,r*.16,-.6,0,7);g.fill()}
  function blk(g,x,y,s,c){const[b,l,d]=PAL[c],e=s*.16;g.fillStyle=d;g.fillRect(x,y,s,s);g.fillStyle=l;g.fillRect(x,y,s-e,s-e);g.fillStyle=b;g.fillRect(x+e,y+e,s-2*e,s-2*e)}
  const ICON={
    bub(g,S){ball(g,S*.3,S*.32,S*.17,'red');ball(g,S*.66,S*.32,S*.17,'cyan');ball(g,S*.48,S*.62,S*.17,'yellow');ball(g,S*.2,S*.66,S*.11,'purple');ball(g,S*.8,S*.68,S*.11,'green')},
    blk(g,S){const s=S*.22;[[0,0,'orange'],[1,0,'orange'],[1,1,'cyan'],[2,1,'cyan'],[0,2,'purple'],[1,2,'green'],[2,2,'green'],[2,0,'yellow']].forEach(([a,b,c])=>blk(g,S*.17+a*s,S*.17+b*s,s-2,c))},
    cdy(g,S){const[a,b,c]=gemImgs;[[c,.08,.36,.5],[b,.44,.34,.5],[a,.22,.06,.58]].forEach(([im,x,y,s])=>{if(im.complete&&im.naturalWidth)g.drawImage(im,S*x,S*y,S*s,S*s)})},
    sol(g,S){const card=(x,y,rot,red,txt)=>{g.save();g.translate(x,y);g.rotate(rot);rr(g,-S*.17,-S*.24,S*.34,S*.48,S*.04);g.fillStyle='#fbf8f0';g.fill();g.strokeStyle='#bdb5a1';g.lineWidth=1;g.stroke();
        g.fillStyle=red?'#d2343b':'#1f2547';g.font='700 '+Math.round(S*.15)+'px Fredoka, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,-S*.05);
        g.beginPath();const z=S*.1,yy=S*.11;if(red){g.moveTo(0,yy+z*.48);g.bezierCurveTo(-z*.95,yy-z*.12,-z*.38,yy-z*.8,0,yy-z*.28);g.bezierCurveTo(z*.38,yy-z*.8,z*.95,yy-z*.12,0,yy+z*.48)}
        else{g.moveTo(0,yy-z*.55);g.bezierCurveTo(z*.95,yy+z*.02,z*.38,yy+z*.62,0,yy+z*.16);g.bezierCurveTo(-z*.38,yy+z*.62,-z*.95,yy+z*.02,0,yy-z*.55);g.moveTo(0,yy);g.lineTo(z*.17,yy+z*.52);g.lineTo(-z*.17,yy+z*.52)}g.fill();g.restore()};
      card(S*.36,S*.52,-.25,false,'R');card(S*.62,S*.5,.2,true,'A')},
    sdk(g,S){const o=S*.14,c=(S-2*o)/3;g.fillStyle='#1e2a60';g.fillRect(o,o,S-2*o,S-2*o);g.strokeStyle='#8e9bcc';g.lineWidth=2;g.strokeRect(o,o,S-2*o,S-2*o);
      g.lineWidth=1;g.beginPath();for(let k=1;k<3;k++){g.moveTo(o+k*c,o);g.lineTo(o+k*c,S-o);g.moveTo(o,o+k*c);g.lineTo(S-o,o+k*c)}g.stroke();
      g.font='700 '+Math.round(c*.65)+'px Fredoka, sans-serif';g.textAlign='center';g.textBaseline='middle';
      [[0,0,'5','#eef2ff'],[2,0,'3','#eef2ff'],[1,1,'9','#7fd0ff'],[0,2,'1','#eef2ff'],[2,2,'7','#7fd0ff']].forEach(([a,b,t,cl])=>{g.fillStyle=cl;g.fillText(t,o+a*c+c/2,o+b*c+c/2+1)})},
    mns(g,S){const s=S*.33,o=S*.17;for(let a=0;a<2;a++)for(let b=0;b<2;b++){const x=o+a*s,y=o+b*s;rr(g,x+1,y+1,s-2,s-2,s*.16);
        if(a===1&&b===1){g.fillStyle='#121a3c';g.fill();g.fillStyle='#5aa8ff';g.font='700 '+Math.round(s*.6)+'px Fredoka, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('1',x+s/2,y+s/2+1)}
        else{const gr=g.createLinearGradient(x,y,x+s,y+s);gr.addColorStop(0,'#4a5fb0');gr.addColorStop(1,'#26347a');g.fillStyle=gr;g.fill()}}
      const fx=o+s/2,fy=o+s*.8;g.fillStyle='#d9dbe8';g.fillRect(fx-1.5,fy-s*.6,3,s*.6);g.fillStyle='#ff4d5e';g.beginPath();g.moveTo(fx+1.5,fy-s*.6);g.lineTo(fx+s*.3,fy-s*.47);g.lineTo(fx+1.5,fy-s*.34);g.fill();
      const cx=o+s*1.5,cy=o+s/2,r=s*.2;g.strokeStyle='#0b0f22';g.lineWidth=2;g.beginPath();for(let k=0;k<4;k++){const an=k*Math.PI/4;g.moveTo(cx-Math.cos(an)*r*1.6,cy-Math.sin(an)*r*1.6);g.lineTo(cx+Math.cos(an)*r*1.6,cy+Math.sin(an)*r*1.6)}g.stroke();
      g.fillStyle='#0b0f22';g.beginPath();g.arc(cx,cy,r,0,7);g.fill()}};
  function draw(){$$('.ticon').forEach(c=>{const S=72,k=DPR();c.width=S*k;c.height=S*k;const g=c.getContext('2d');g.setTransform(k,0,0,k,0,0);g.clearRect(0,0,S,S);ICON[c.dataset.i](g,S)})}
  function subs(fmt){const t=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
    const bl=store.get('bb.bubLvl',0);$('#sub-bub').textContent=['Facile','Moyen','Difficile','Expert'][bl]+' · record '+store.get('bb.bubBest.'+bl,0);
    const ab=store.get('bb.advStars',[]);let an=1;while(Array.isArray(ab)&&ab[an-1])an++;
    $('#sub-blk').textContent='Record '+store.get('bb.blkBest',0)+' · aventure niv. '+an;
    $('#sub-cdy').textContent=Candies.sub();
    const d=store.get('bb.solDraw',1),sb=store.get('bb.solBest'+d,0);$('#sub-sol').textContent='Pioche '+d+(sb?' · record '+t(sb):'');
    $('#sub-sdk').textContent=Sudoku.sub();$('#sub-mns').textContent=Mines.sub()}
  return{draw,refresh:()=>{draw();subs()}}
})();

/* ================= Navigation ================= */
const GAMES={bub:Bubbles,blk:Blocks,cdy:Candies,sol:Solitaire,sdk:Sudoku,mns:Mines};
let active='home';
function show(t){active=t;$('#home').hidden=t!=='home';
  for(const x in GAMES)$('#g-'+x).hidden=t!==x;
  if(t==='home')Home.refresh();else{store.set('bb.tab',t);requestAnimationFrame(()=>GAMES[t].resize());if(GAMES[t].enter)GAMES[t].enter()}}
$$('.tile').forEach(b=>b.onclick=()=>show(b.dataset.g));
$$('.homeb').forEach(b=>b.onclick=()=>show('home'));
show('home');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(active!=='home'&&!Celebrate.active())GAMES[active].frame(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script>
