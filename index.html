<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bulles, Blocs &amp; Bonbons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen arcade console — tabs on top, game stage fills the rest, tray docked under the board */
:root{
  --bg:#141c3a; --panel:#0e1530; --cell:#1b2550; --line:#2c3a72;
  --ink:#eef2ff; --muted:#8e9bcc; --gold:#ffc54d; --tab:#232f5e;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;padding-inline:12px;padding-block:8px;display:flex;flex-direction:column;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--panel);padding:4px;border-radius:14px}
.tab{font:600 1rem var(--display);color:var(--muted);background:transparent;border:0;border-radius:10px;padding:7px 0;cursor:pointer;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--tab);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}
.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;gap:10px;flex:none}
.stat{display:flex;flex-direction:column;line-height:1.05}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500}
.val{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.best .val{font-size:1.05rem;color:var(--gold)}
.btn{margin-left:auto;font:600 .85rem var(--display);color:var(--ink);background:var(--tab);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}

.ico{font-size:1.15rem;line-height:1;padding:7px 10px;min-width:40px}
.ico+.ico{margin-left:0}
.sel{margin-left:auto;font:600 .85rem var(--display);color:var(--gold);background:var(--tab);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer}
.sel:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.sel+.ico{margin-left:0}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
canvas{display:block;touch-action:none}
#bub-cv,#blk-cv,#cdy-cv{border-radius:12px}
.hud .stat{min-width:0}
.hud .ico{flex:none}
.hud .sel{min-width:0;flex:0 1 auto;max-width:9.5rem}
#cdy-v1{font-size:1.05rem;white-space:nowrap}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.25em;vertical-align:.05em}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,32,.72);border-radius:12px}
.over .card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 26px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
.over h2{margin:0;font-size:1.5rem;font-weight:700}
.over p{margin:0;color:var(--muted)}
.over .big{font-size:2.2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.over .btn{margin:6px 0 0;background:var(--gold);color:#1a1300;border:0;padding:10px 20px;font-size:1rem}
.stars{font-size:2rem;letter-spacing:.15em;color:var(--gold)}
.stars .off{color:var(--line)}
.over .btn.alt{background:var(--tab);color:var(--ink);border:1px solid var(--line)}
.tray{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);grid-template-rows:108px;gap:8px;height:108px;flex:none;overflow:hidden}
.slot{width:100%;height:108px;min-width:0;cursor:grab}
.nextbox{position:relative;height:108px;min-width:0;overflow:hidden;border:1px dashed var(--line);border-radius:12px;text-align:center;padding-top:6px}
.nextbox canvas{position:absolute;left:4px;right:4px;top:24px;bottom:4px;width:calc(100% - 8px);height:calc(100% - 28px)}
.drag{position:fixed;left:0;top:0;pointer-events:none;z-index:10}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}
</style>
</head>
<body>


<div class="app">
  <nav class="tabs" role="tablist" aria-label="Choisir un jeu">
    <button id="tab-bub" class="tab" role="tab" aria-selected="true">Bulles</button>
    <button id="tab-blk" class="tab" role="tab" aria-selected="false">Blocs</button>
    <button id="tab-cdy" class="tab" role="tab" aria-selected="false">Bonbons</button>
  </nav>

  <section id="g-bub" class="game">
    <div class="hud">
      <div class="stat"><span class="lbl">Score</span><span id="bub-score" class="val">0</span></div>
      <div class="stat best"><span class="lbl">Record</span><span id="bub-best" class="val">0</span></div>
      <select id="bub-lvl" class="sel" aria-label="Niveau">
        <option value="0">Facile</option><option value="1">Moyen</option>
        <option value="2">Difficile</option><option value="3">Expert</option>
      </select>
      <button id="bub-new" class="btn ico" aria-label="Nouvelle partie" title="Nouvelle partie">↻</button>
      <button id="bub-snd" class="btn ico snd" aria-label="Son">🔊</button>
    </div>
    <div class="stage" id="bub-stage">
      <canvas id="bub-cv"></canvas>
      <div class="over" id="bub-over" hidden><div class="card">
        <h2>Les bulles ont gagné</h2><p>Score</p><div class="big" id="bub-final">0</div>
        <button class="btn" id="bub-again">Rejouer</button></div></div>
    </div>
  </section>

  <section id="g-blk" class="game" hidden>
    <div class="hud">
      <div class="stat"><span class="lbl" id="blk-l1">Score</span><span id="blk-v1" class="val">0</span></div>
      <div class="stat best"><span class="lbl" id="blk-l2">Record</span><span id="blk-v2" class="val">0</span></div>
      <select id="blk-sel" class="sel" aria-label="Mode de jeu"></select>
      <button id="blk-new" class="btn ico" aria-label="Recommencer" title="Recommencer">↻</button>
    </div>
    <div class="stage" id="blk-stage">
      <canvas id="blk-cv"></canvas>
      <div class="over" id="blk-over" hidden><div class="card">
        <h2 id="blk-ot">Plus de place</h2><p id="blk-os">Score</p><div class="big" id="blk-final">0</div>
        <div class="stars" id="blk-stars" hidden></div>
        <button class="btn" id="blk-nextlvl" hidden>Niveau suivant</button>
        <button class="btn alt" id="blk-again">Rejouer</button></div></div>
    </div>
    <div class="tray">
      <canvas class="slot" data-i="0"></canvas>
      <canvas class="slot" data-i="1"></canvas>
      <canvas class="slot" data-i="2"></canvas>
      <div class="nextbox"><span class="lbl">Suivante</span><canvas id="blk-next"></canvas></div>
    </div>
  </section>

  <section id="g-cdy" class="game" hidden>
    <div class="hud">
      <div class="stat"><span class="lbl" id="cdy-l1">Objectif</span><span id="cdy-v1" class="val">0</span></div>
      <div class="stat best"><span class="lbl">Coups</span><span id="cdy-v2" class="val">0</span></div>
      <select id="cdy-sel" class="sel" aria-label="Niveau"></select>
      <button id="cdy-new" class="btn ico" aria-label="Recommencer le niveau" title="Recommencer">↻</button>
    </div>
    <div class="stage" id="cdy-stage">
      <canvas id="cdy-cv"></canvas>
      <div class="over" id="cdy-over" hidden><div class="card">
        <h2 id="cdy-ot">Raté !</h2><p id="cdy-os"></p>
        <div class="stars" id="cdy-stars" hidden></div>
        <button class="btn" id="cdy-nextlvl" hidden>Niveau suivant</button>
        <button class="btn alt" id="cdy-again">Réessayer</button></div></div>
    </div>
  </section>
</div>
<canvas id="drag" class="drag" hidden></canvas>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const DPR=()=>Math.min(window.devicePixelRatio||1,3);
const PAL={
  red:['#e84545','#ff9d92','#9c1d1d'], orange:['#f0892a','#ffc27a','#a9560b'],
  yellow:['#f5c518','#ffe880','#b08600'], green:['#36c060','#8cf0a8','#1b7f39'],
  cyan:['#35b9f2','#a8e7ff','#0a76a8'], blue:['#4a68f2','#a2b4ff','#2537a8'],
  purple:['#a259e6','#d6aaff','#64249f']
};

/* ================= BULLES ================= */
const Bubbles=(()=>{
  const R=20,RH=R*Math.sqrt(3);
  const LEVELS=[{cols:10,rows:12,start:6},{cols:13,rows:17,start:9},{cols:15,rows:19,start:10},{cols:17,rows:22,start:11}];
  let lvl=store.get('bb.bubLvl',0),COLS,DR,START,W,H,SX,SY,NX,NY,LIMIT;
  if(!(lvl>=0&&lvl<4))lvl=0;
  let aspect=0;
  function dims(){const L=LEVELS[lvl];COLS=L.cols;START=L.start;W=(2*COLS+1)*R;
    H=aspect?Math.floor(W*aspect):Math.round(R+L.rows*RH+110);
    DR=Math.max(START+3,Math.floor((H-110-R)/RH));
    SX=W/2;SY=H-46;NX=SX-90;NY=SY+8;LIMIT=R+(DR-1)*RH+R+4}
  dims();
  const COL=['red','yellow','green','cyan','blue','purple','orange'].map(k=>PAL[k]);
  const cv=$('#bub-cv'),ctx=cv.getContext('2d'),stage=$('#bub-stage');
  let grid,parity,cur,nxt,shot,aim=null,aiming=false,fx=[],score,over,slide=0,k=1;
  (()=>{const old=store.get('bb.bubBest',null);if(old!=null&&store.get('bb.bubBest.3',null)==null)store.set('bb.bubBest.3',old)})();
  let best=store.get('bb.bubBest.'+lvl,0);
  const STEP=.035;
  let AC=null,muted=store.get('bb.mute',false);
  function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
  function plop(n){if(muted||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=520+Math.min(n,20)*45;
    o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.07);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.09);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.1)}catch(e){}}
  function thud(){if(muted||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(90,t+.18);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.22)}catch(e){}}
  const sndBtn=$('#bub-snd');const sndUI=()=>{sndBtn.textContent=muted?'🔇':'🔊'};sndUI();
  sndBtn.onclick=()=>{muted=!muted;store.set('bb.mute',muted);sndUI();audio()};

  const shifted=r=>((r+parity)&1)===1;
  const cx=(r,c)=>R+c*2*R+(shifted(r)?R:0);
  const cy=r=>R+r*RH;
  const at=(r,c)=>(grid[r]&&grid[r][c]!=null)?grid[r][c]:null;
  let shots=0;
  // Facile 4 couleurs, Moyen 5, Difficile 6, Expert 7
  const nCol=()=>4+lvl;
  // pool : couleurs autorisées. Les nouvelles rangées n'utilisent que les couleurs encore présentes.
  const newRow=(pool)=>{const p=pool&&pool.length?pool:[...Array(nCol()).keys()];return Array.from({length:COLS},()=>p[rnd(p.length)])};
  function present(){const s=new Set();for(const row of grid)for(const v of row)if(v!=null)s.add(v);return[...s]}
  function pick(){const p=present();return p.length?p[rnd(p.length)]:rnd(nCol())}
  function nbrs(r,c){const o=[[r,c-1],[r,c+1]];const a=shifted(r)?[c,c+1]:[c-1,c];
    for(const rr of[r-1,r+1])for(const cc of a)o.push([rr,cc]);
    return o.filter(([rr,cc])=>rr>=0&&cc>=0&&cc<COLS)}

  function reset(){shots=0;grid=[];parity=0;for(let i=0;i<START;i++)grid.push(newRow());
    score=0;over=false;shot=null;fx=[];slide=0;cur=pick();nxt=pick();aim=null;hud();$('#bub-over').hidden=true}
  function hud(){if(score>best){best=score;store.set('bb.bubBest.'+lvl,best)}
    $('#bub-score').textContent=score;$('#bub-best').textContent=best}

  function hits(x,y){if(y<=R)return true;
    if(y>cy(grid.length)+2*R)return false;
    const lim=(2*R*.88)**2;
    for(let r=0;r<grid.length;r++){const yy=cy(r);if(Math.abs(yy-y)>2*R)continue;
      for(let c=0;c<COLS;c++){if(grid[r][c]==null)continue;const dx=cx(r,c)-x,dy=yy-y;if(dx*dx+dy*dy<lim)return true}}
    return false}
  function snap(x,y){let b=null,bd=1e9;
    for(let r=0;r<=grid.length;r++)for(let c=0;c<COLS;c++){
      if(at(r,c)!=null)continue;
      if(r>0&&!nbrs(r,c).some(([a,q])=>at(a,q)!=null))continue;
      const d=(cx(r,c)-x)**2+(cy(r)-y)**2;if(d<bd){bd=d;b=[r,c]}}
    return b}
  function trace(a){let x=SX,y=SY,dx=Math.cos(a),dy=-Math.sin(a);const pts=[];
    for(let i=0;i<1600;i++){x+=dx*4;y+=dy*4;
      if(x<R){x=2*R-x;dx=-dx}if(x>W-R){x=2*(W-R)-x;dx=-dx}
      if(i%6===3)pts.push([x,y]);if(hits(x,y))break}
    return{pts,x,y}}
  function flood(r,c){const col=grid[r][c],seen=new Set([r+','+c]),q=[[r,c]],out=[];
    while(q.length){const[a,b]=q.pop();out.push([a,b]);
      for(const[x,y]of nbrs(a,b)){const key=x+','+y;if(!seen.has(key)&&at(x,y)===col){seen.add(key);q.push([x,y])}}}
    return out}
  function floating(){const seen=new Set(),q=[];
    if(grid[0])for(let c=0;c<COLS;c++)if(grid[0][c]!=null){seen.add('0,'+c);q.push([0,c])}
    while(q.length){const[a,b]=q.pop();for(const[x,y]of nbrs(a,b)){const key=x+','+y;if(!seen.has(key)&&at(x,y)!=null){seen.add(key);q.push([x,y])}}}
    const out=[];for(let r=0;r<grid.length;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!=null&&!seen.has(r+','+c))out.push([r,c]);
    return out}
  function addRow(){grid.unshift(newRow(present()));parity^=1;slide=RH}
  function trim(){while(grid.length&&grid[grid.length-1].every(v=>v==null))grid.pop()}

  function fire(){if(over||shot||aim==null)return;shots++;
    shot={x:SX,y:SY,dx:Math.cos(aim),dy:-Math.sin(aim),c:cur};cur=nxt;nxt=null}
  function land(){const cell=snap(shot.x,shot.y);const color=shot.c;shot=null;if(!cell)return;
    const[r,c]=cell;while(grid.length<=r)grid.push(Array(COLS).fill(null));grid[r][c]=color;
    const grp=flood(r,c);
    if(grp.length>=3){
      const ox=cx(r,c),oy=cy(r);grp.sort((p,q)=>Math.hypot(cx(p[0],p[1])-ox,cy(p[0])-oy)-Math.hypot(cx(q[0],q[1])-ox,cy(q[0])-oy));
      grp.forEach(([a,b],i)=>{fx.push({t:'pop',x:cx(a,b),y:cy(a),c:grid[a][b],age:-i*STEP,n:i});grid[a][b]=null});
      score+=grp.length*10;
      const fl=floating();
      fl.forEach(([a,b],i)=>{fx.push({t:'fall',x:cx(a,b),y:cy(a),vx:(Math.random()-.5)*180*(H/545),vy:(-120-Math.random()*180)*(H/545),c:grid[a][b],wait:grp.length*STEP+i*.012,first:i===0});grid[a][b]=null;score+=20+i*5});
      trim();
      if(!present().length){score+=500;grid=[];parity=0;for(let i=0;i<START;i++)grid.push(newRow());slide=RH*2}
    }else addRow();
    trim();
    nxt=pick();const p=present();if(p.length&&!p.includes(cur))cur=pick();
    for(let rr=DR;rr<grid.length;rr++)if(grid[rr].some(v=>v!=null)){over=true;break}
    hud();
    if(over){$('#bub-final').textContent=score;$('#bub-over').hidden=false}}

  function bubble(x,y,r,col,alpha=1){const[b,l,d]=COL[col];ctx.globalAlpha=alpha;
    const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
    g.addColorStop(0,l);g.addColorStop(.55,b);g.addColorStop(1,d);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(x-r*.33,y-r*.45,r*.27,r*.16,-.6,0,7);ctx.fill();
    ctx.globalAlpha=1}

  function frame(dt){
    if(shot){const V=(SY-R)/.4,dist=V*dt,n=Math.max(1,Math.ceil(dist/4)),st=dist/n;
      for(let i=0;i<n;i++){shot.x+=shot.dx*st;shot.y+=shot.dy*st;
      if(shot.x<R){shot.x=2*R-shot.x;shot.dx=-shot.dx}if(shot.x>W-R){shot.x=2*(W-R)-shot.x;shot.dx=-shot.dx}
      if(hits(shot.x,shot.y)){land();break}}}
    slide=Math.max(0,slide-RH*dt*5);
    fx=fx.filter(f=>{if(f.t==='pop'){const was=f.age;f.age+=dt;if(was<0&&f.age>=0)plop(f.n);return f.age<.22}
      if(f.wait>0){f.wait-=dt;if(f.wait<=0&&f.first)thud();return true}
      f.vy+=3*H*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;return f.y<H+R});
    // draw
    ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1d2a5c');bg.addColorStop(1,'#121a3c');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,120,120,.35)';ctx.setLineDash([6,6]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,LIMIT);ctx.lineTo(W,LIMIT);ctx.stroke();ctx.setLineDash([]);
    ctx.save();ctx.translate(0,-slide);
    for(let r=0;r<grid.length;r++)for(let c=0;c<COLS;c++)if(grid[r][c]!=null)bubble(cx(r,c),cy(r),R-1,grid[r][c]);
    ctx.restore();
    if(aim!=null&&!shot&&!over){const t=trace(aim);
      ctx.fillStyle=COL[cur][1];t.pts.forEach(([x,y],i)=>{ctx.globalAlpha=Math.max(.25,1-i/80);ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()});
      ctx.globalAlpha=1;const cell=snap(t.x,t.y);
      if(cell){ctx.strokeStyle=COL[cur][1];ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx(cell[0],cell[1]),cy(cell[0]),R-2,0,7);ctx.stroke();ctx.setLineDash([])}}
    for(const f of fx){if(f.t==='pop'){if(f.age<0){bubble(f.x,f.y-slide,R-1,f.c);continue}
        const p=f.age/.22;bubble(f.x,f.y-slide,R*(1+p*.5),f.c,1-p);
        ctx.globalAlpha=1-p;ctx.strokeStyle=COL[f.c][1];ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y-slide,R*(1+p*1.5),0,7);ctx.stroke();ctx.globalAlpha=1}
      else bubble(f.x,f.y,R-1,f.c)}
    // shooter
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(SX,SY,R+10,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(SX,SY,R+10,0,7);ctx.stroke();
    if(shot)bubble(shot.x,shot.y,R-1,shot.c);
    if(!over)bubble(SX,SY,R-1,cur);
    if(nxt!=null){bubble(NX,NY,R*.78,nxt)}
    ctx.fillStyle='#8e9bcc';ctx.font='500 '+Math.round(W/38)+'px Fredoka, sans-serif';ctx.textAlign='center';

  function genLevel(n){const R=mulberry(n*7919+13),r=k=>Math.floor(R()*k);
    const type=['score','gems','ice'][(n-1)%3];
    const L={n,type,col:new Array(N*N).fill(-1),gem:new Array(N*N).fill(false),ice:new Array(N*N).fill(0),moves:0,goal:0};
    const empty=()=>{for(let t=0;t<200;t++){const i=r(N*N);if(L.col[i]<0)return i}return -1};
    const nStone=Math.min(10,Math.floor((n-1)/2));

    for(let pass=0;pass<3;pass++){

  /* ---------- Dessin ---------- */
  function block(g,x,y,s,ci,alpha=1){const[b,l,d]=KEYS[ci];const e=Math.max(2,s*.14);g.globalAlpha=alpha;

    g.globalAlpha=1}
  function diamond(x,y,s,alpha=1){const cx=x+s/2,cy=y+s/2,r=s*.3;ctx.globalAlpha=alpha;

/* ================= BONBONS ================= */
const Candies=(()=>{
  const N=8,CK=['red','orange','yellow','green','blue','purple'].map(k=>PAL[k]);

  const id=(r,c)=>r*N+c, RC=i=>[Math.floor(i/N),i%N];

  let AC=null;
  function initA(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

  /* ---------- Niveaux ---------- */
  function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function genLevel(n){const R=mulberry(n*104729+7),r=k=>Math.floor(R()*k);
    const type=['score','color','jelly'][(n-1)%3];
    const L={n,type,nCol:n<=4?5:6,goal:0,moves:0,color:0,jelly:[]};
    if(type==='score'){L.goal=600+n*200;L.moves=22+Math.min(4,Math.floor(n/5))}
    else if(type==='color'){L.color=r(L.nCol);L.goal=10+n;L.moves=22}
    else{const cnt=Math.min(40,8+n*2),s=new Set();while(s.size<cnt){const rr=1+r(N-2),cc=r(N);s.add(id(rr,cc))}

  const rc=()=>rnd(lv.nCol);

  /* ---------- Plateau ---------- */
  function runs(){const out=[];
    for(let r=0;r<N;r++){let c=0;while(c<N){const k=g[r][c];if(!k||k.c<0){c++;continue}
      let e=c+1;while(e<N&&g[r][e]&&g[r][e].c===k.c)e++;
      if(e-c>=3){const cells=[];for(let x=c;x<e;x++)cells.push(id(r,x));out.push({cells,h:true})}c=e}}
    for(let c=0;c<N;c++){let r=0;while(r<N){const k=g[r][c];if(!k||k.c<0){r++;continue}
      let e=r+1;while(e<N&&g[e][c]&&g[e][c].c===k.c)e++;
      if(e-r>=3){const cells=[];for(let y=r;y<e;y++)cells.push(id(y,c));out.push({cells,h:false})}r=e}}

  function analyze(prefer){const rs=runs();if(!rs.length)return null;
    const cells=new Set(),cnt=new Map(),creates=[],used=new Set();
    rs.forEach(rn=>rn.cells.forEach(i=>{cells.add(i);cnt.set(i,(cnt.get(i)||0)+1)}));
    const colOf=i=>{const[r,c]=RC(i);return g[r][c].c};
    const pick=rn=>{const p=rn.cells.find(i=>prefer&&prefer.includes(i)&&!used.has(i));return p!=null?p:rn.cells[Math.floor(rn.cells.length/2)]};
    rs.filter(rn=>rn.cells.length>=5).forEach(rn=>{const i=pick(rn);if(!used.has(i)){used.add(i);creates.push({i,c:-1,s:'b'})}});
    for(const[i,n]of cnt)if(n>1&&!used.has(i)){used.add(i);creates.push({i,c:colOf(i),s:'w'})}
    rs.filter(rn=>rn.cells.length===4&&!rn.cells.some(i=>used.has(i))).forEach(rn=>{const i=pick(rn);used.add(i);creates.push({i,c:colOf(i),s:rn.h?'v':'h'})});
    return{cells,creates}}
  function swapG(a,b){const t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t}
  function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=g[r][c];if(k.s==='b')return true;
      for(const[dr,dc]of[[0,1],[1,0]]){const rr=r+dr,cc=c+dc;if(rr>=N||cc>=N)continue;
        if(k.s&&g[rr][cc].s)return true;
        swapG([r,c],[rr,cc]);const ok=runs().length>0;swapG([r,c],[rr,cc]);if(ok)return true}}
    return false}
  function fresh(){g=[];for(let r=0;r<N;r++){g.push([]);for(let c=0;c<N;c++){let col,t=0;
      do{col=rc();t++}while(t<30&&((c>=2&&g[r][c-1].c===col&&g[r][c-2].c===col)||(r>=2&&g[r-1][c].c===col&&g[r-2][c].c===col)));
      g[r].push(mk(col,'',r-N-1))}}}
  function shuffle(){const cs=[];for(const row of g)for(const k of row)if(!k.s)cs.push(k.c);
    for(let t=0;t<60;t++){for(let i=cs.length-1;i>0;i--){const j=rnd(i+1);[cs[i],cs[j]]=[cs[j],cs[i]]}
      let n=0;for(const row of g)for(const k of row)if(!k.s)k.c=cs[n++];
      if(!runs().length&&hasMove()){fx.push({t:'txt',s:'Mélange !',age:0});return}}
    fresh();state='fall'}

  /* ---------- Effacement, gravité, cascades ---------- */
  function present(){const s=new Set();for(const row of g)for(const k of row)if(k&&k.c>=0)s.add(k.c);return[...s]}

    while(q.length){const i=q.pop();if(trig.has(i))continue;trig.add(i);const[r,c]=RC(i),k=g[r][c];if(!k||!k.s)continue;
      const add=[];

      else if(k.s==='v')for(let y=0;y<N;y++)add.push(id(y,c));
      else if(k.s==='w'){for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&x>=0&&y<N&&x<N)add.push(id(y,x));fx.push({t:'boom',r,c,age:0})}
      else if(k.s==='b'){const p=present();const col=k.target!=null?k.target:p[rnd(p.length)];

  /* ---------- Échanges ---------- */
  const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;

  /* ---------- Fin de niveau ---------- */
  const done=()=>lv.type==='score'?score>=lv.goal:got>=lv.goal;
  function showOver(title,sub,st,canNext,again){

    $('#cdy-nextlvl').hidden=!canNext;$('#cdy-again').textContent=again;

  function win(){over=true;const ratio=moves/lv.moves,st=ratio>=.3?3:ratio>=.12?2:1;

    showOver('Niveau '+lv.n+' réussi !','Score '+score+' · coups restants : '+moves,st,true,'Rejouer')}
  function lose(){over=true;showOver('Raté !','Plus de coups. Objectif : '+objPlain(),0,false,'Réessayer')}

  function objPlain(){return lv.type==='score'?score+' / '+lv.goal+' points':lv.type==='color'?got+' / '+lv.goal+' bonbons '+NAMES[lv.color]:got+' / '+lv.goal+' gelées'}
  function hud(){const l1=$('#cdy-l1'),v1=$('#cdy-v1');

    else if(lv.type==='color'){l1.textContent='Collecter';v1.innerHTML='<i class="dot" style="background:'+CK[lv.color][0]+'"></i>'+Math.min(got,lv.goal)+'/'+lv.goal}

  function fillSel(){const u=unlocked();let h='';

    selEl.innerHTML=h;selEl.value=String(cur)}
  function reset(){lv=genLevel(cur);score=0;got=0;moves=lv.moves;cascade=1;over=false;sel=null;ptr=null;fx=[];

  /* ---------- Dessin ---------- */

  function paint(g,ci,sp,S){const cx=S/2,cy=S/2,r=S*.41;

    if(sp==='b'){let gr;
      if(g.createConicGradient){gr=g.createConicGradient(0,cx,cy);['#ff5a5a','#ffb03a','#ffe14d','#4fd67a','#4aa8ff','#a873ff','#ff5a5a'].forEach((c,i,a)=>gr.addColorStop(i/(a.length-1),c))}
      else{gr=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);['#ff5a5a','#ffe14d','#4fd67a','#4aa8ff','#a873ff'].forEach((c,i,a)=>gr.addColorStop(i/(a.length-1),c))}

  function sprite(ci,sp){const key=ci+'|'+sp;if(cache[key])return cache[key];

  function frame(dt){

  /* ---------- Toucher ---------- */

    if(Math.max(Math.abs(dx),Math.abs(dy))<cell*.35)return;
    const[r,c]=ptr.p,t=Math.abs(dx)>Math.abs(dy)?[r,c+Math.sign(dx)]:[r+Math.sign(dy),c];ptr=null;
    if(t[0]>=0&&t[1]>=0&&t[0]<N&&t[1]<N)trySwap([r,c],t)});
  cv.addEventListener('pointerup',()=>{if(!ptr)return;const p=ptr.p;ptr=null;
    if(sel&&adj(sel,p))trySwap(sel,p);else sel=sel&&sel[0]===p[0]&&sel[1]===p[1]?null:p});
  cv.addEventListener('pointercancel',()=>{ptr=null});

  function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
    size=Math.floor(Math.min(w,h)/N)*N;cell=size/N;cv.style.width=size+'px';cv.style.height=size+'px';
    cv.width=Math.round(size*DPR());cv.height=Math.round(size*DPR());cache={}}
  new ResizeObserver(resize).observe(stage);
  function choose(n){cur=+n;store.set('bb.cdySel',cur);reset()}
  selEl.onchange=()=>{choose(selEl.value);selEl.blur()};
  $('#cdy-new').onclick=reset;$('#cdy-again').onclick=reset;
  $('#cdy-nextlvl').onclick=()=>choose(lv.n+1);
  reset();
  return{frame,resize}
})();

/* ================= Navigation ================= */
let active=store.get('bb.tab','bub');
function show(t){active=t;store.set('bb.tab',t);
  for(const x of['bub','blk','cdy']){$('#g-'+x).hidden=t!==x;$('#tab-'+x).setAttribute('aria-selected',t===x)}
  requestAnimationFrame(()=>{Bubbles.resize();Blocks.resize();Candies.resize()})}
for(const x of['bub','blk','cdy'])$('#tab-'+x).onclick=()=>show(x);
if(!['bub','blk','cdy'].includes(active))active='bub';
show(active);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  ({bub:Bubbles,blk:Blocks,cdy:Candies})[active].frame(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script>
